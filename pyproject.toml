[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "pdf-document-mcp"
version = "1.0.7"
readme = "README.md"
description = "Pdf Document Mcp: extract text from pdf (Extract text content from a PDF file. Optionally specify pag); convert pdf to markdown (Convert a PDF document to Markdown format. Detects headings ); merge pdfs (Merge multiple PDF files into a single document.); extract tables (Extract table-like structures from a specific page in a PDF.). pip install pdf-document-mcp."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
dependencies = ["mcp>=1.0.0", "pymupdf>=1.21.0", ]
keywords = ["mcp", "ai", "meok", "pdf", "document", "mcp/"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/pdf-document-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py"]

[project.scripts]
pdf_document_mcp = "server:main"
